  xml: ^6.5.0
  awesome_video_player: ^1.0.5
  buttons_tabbar: ^1.3.1
  flutter_radio_player: 4.1.0
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  s_webview: ^2.1.0

dev_dependencies:
