version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  flutter_native_splash: ^2.4.7
  lottie: ^3.3.3
  http: ^1.6.0
  cached_network_image: ^3.4.1
